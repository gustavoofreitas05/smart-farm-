{% extends "layout.html" %}
{% block title %}Editar produção - Smart Farm{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Editar produção</h1>
</div>

<div class="card form-card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="type">Tipo</label>
            <input type="text" id="type" name="type" value="{{ record.type }}" required>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="quantity">Quantidade</label>
                <input type="number" step="0.01" id="quantity" name="quantity" value="{{ record.quantity }}" required>
            </div>
            <div class="field">
                <label for="unit">Unidade</label>
                <input type="text" id="unit" name="unit" value="{{ record.unit }}" required>
            </div>
        </div>
        <div class="field">
            <label for="animal_id">Animal / origem (opcional)</label>
            <select id="animal_id" name="animal_id">
                <option value="">—</option>
                {% for a in animals %}
                <option value="{{ a.id }}" {{ 'selected' if record.animal_id == a.id }}>{{ a.name }} ({{ a.species }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="production_date">Data</label>
            <input type="date" id="production_date" name="production_date" value="{{ record.production_date }}" required>
        </div>
        <div class="field">
            <label for="notes">Observações</label>
            <textarea id="notes" name="notes" rows="3">{{ record.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn">Salvar alterações</button>
        <a href="{{ url_for('production_index') }}" class="btn secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
