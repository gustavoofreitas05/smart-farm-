{% extends "layout.html" %}
{% block title %}Registrar produção - Smart Farm{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Registrar produção</h1>
</div>

<div class="card form-card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="type">Tipo</label>
            <input type="text" id="type" name="type" placeholder="Ovos, Leite, Banana..." required>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="quantity">Quantidade</label>
                <input type="number" step="0.01" id="quantity" name="quantity" required>
            </div>
            <div class="field">
                <label for="unit">Unidade</label>
                <input type="text" id="unit" name="unit" placeholder="unidades, litros, kg" required>
            </div>
        </div>
        <div class="field">
            <label for="animal_id">Animal / origem (opcional)</label>
            <select id="animal_id" name="animal_id">
                <option value="">—</option>
                {% for a in animals %}
                <option value="{{ a.id }}">{{ a.name }} ({{ a.species }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="production_date">Data</label>
            <input type="date" id="production_date" name="production_date">
        </div>
        <div class="field">
            <label for="notes">Observações</label>
            <textarea id="notes" name="notes" rows="3"></textarea>
        </div>
        <button type="submit" class="btn">Salvar</button>
        <a href="{{ url_for('production_index') }}" class="btn secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
