{% extends "layout.html" %}
{% block title %}Editar despesa - Smart Farm{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Editar despesa</h1>
</div>

<div class="card form-card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="category">Categoria</label>
            <select id="category" name="category" required>
                {% for c in categories %}
                <option value="{{ c }}" {{ 'selected' if record.category == c }}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" value="{{ record.description or '' }}">
        </div>
        <div class="field-row">
            <div class="field">
                <label for="amount">Valor (R$)</label>
                <input type="number" step="0.01" id="amount" name="amount" value="{{ record.amount }}" required>
            </div>
            <div class="field">
                <label for="expense_date">Data</label>
                <input type="date" id="expense_date" name="expense_date" value="{{ record.expense_date }}" required>
            </div>
        </div>
        <div class="field">
            <label for="notes">Observações</label>
            <textarea id="notes" name="notes" rows="3">{{ record.notes or '' }}</textarea>
        </div>
        <button type="submit" class="btn">Salvar alterações</button>
        <a href="{{ url_for('expenses_index') }}" class="btn secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
